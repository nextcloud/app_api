version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 10
    target-branch: stable35
    open-pull-requests-limit: 5
    ignore:
      # major updates are breaking changes and never belong on a stable branch;
      # minors have to stay allowed, otherwise dependabot cannot keep package-lock.json
      # consistent when a patch update pulls in a newer transitive dependency
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 10
    target-branch: stable34
    open-pull-requests-limit: 5
    ignore:
      # major updates are breaking changes and never belong on a stable branch;
      # minors have to stay allowed, otherwise dependabot cannot keep package-lock.json
      # consistent when a patch update pulls in a newer transitive dependency
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 10
    target-branch: stable33
    open-pull-requests-limit: 5
    ignore:
      # major updates are breaking changes and never belong on a stable branch;
      # minors have to stay allowed, otherwise dependabot cannot keep package-lock.json
      # consistent when a patch update pulls in a newer transitive dependency
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 10
    target-branch: stable32
    open-pull-requests-limit: 5
    ignore:
      # major updates are breaking changes and never belong on a stable branch;
      # minors have to stay allowed, otherwise dependabot cannot keep package-lock.json
      # consistent when a patch update pulls in a newer transitive dependency
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
